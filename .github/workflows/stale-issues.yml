name: Export Open Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  generate-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Issues and Generate Doc
        uses: octokit/request-action@v2
        id: get_issues
        with:
          route: GET /repos/${{ github.repository }}/issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Issues to File
        run: |
          echo "# Open Issues" > ISSUES.md
          echo "${{ steps.get_issues.outputs.data }}" | jq -r '.[] | "- [\(.title)](\(.html_url))"' >> ISSUES.md

      - name: Upload issue report
        uses: actions/upload-artifact@v4
        with:
          name: open-issues-${{ github.run_id }}
          path: ISSUES.md
