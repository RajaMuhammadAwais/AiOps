name: AIOps CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Default-deny write access. Jobs must request any additional permission explicitly.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements-local.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Check required files
        run: |
          test -f requirements-local.txt
          test -f requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint dashboard and platform modules with flake8
        run: flake8 web_dashboard.py src/platform src/monitoring/log_monitor.py --max-line-length=100 --extend-ignore=E203 --count --show-source --statistics

      - name: Check formatting with black
        run: black --check web_dashboard.py src/platform src/monitoring/log_monitor.py tests

      - name: Static type checks with mypy
        run: mypy src/platform

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=xml tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml

  build-artifacts:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  versioning:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version config exists
        run: test -f .bumpversion.cfg

      - name: Install bump2version
        run: python -m pip install bump2version

      - name: Determine version bump type
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "bump_type=minor" >> "$GITHUB_ENV"
          else
            echo "bump_type=patch" >> "$GITHUB_ENV"
          fi

      - name: Bump version and generate release notes
        run: |
          bump2version "${{ env.bump_type }}"
          current_version="$(awk -F' = ' '/^current_version/ { print $2 }' .bumpversion.cfg)"
          printf 'Release notes for version %s\n' "$current_version" > release_notes.txt

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.run_id }}
          path: release_notes.txt
