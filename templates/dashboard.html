<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ service_name }}</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101418; color: #edf2f7; }
    header { padding: 1.5rem 2rem; background: #17202a; border-bottom: 1px solid #2d3748; }
    main { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); padding: 1.5rem; }
    section { min-height: 10rem; padding: 1rem; background: #18232f; border: 1px solid #2d3748; border-radius: .5rem; }
    h1, h2 { margin-top: 0; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1rem; color: #90cdf4; }
    .wide { grid-column: 1 / -1; }
    .muted { color: #a0aec0; }
    .error { color: #feb2b2; white-space: pre-wrap; }
    pre { max-height: 20rem; overflow: auto; padding: .75rem; background: #0b1117; border-radius: .35rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    input, button { font: inherit; padding: .65rem; border-radius: .35rem; border: 1px solid #4a5568; }
    input { width: min(100%, 48rem); background: #0b1117; color: #edf2f7; }
    button { background: #2b6cb0; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <h1 id="serviceName"></h1>
    <p class="muted">Integration-backed operations view · version <span id="version"></span></p>
  </header>
  <main>
    <section><h2>Service status</h2><div id="status" class="muted">Loading from configured sources…</div></section>
    <section><h2>Service-level objective</h2><pre id="slo">Loading…</pre></section>
    <section><h2>Active alerts</h2><pre id="alerts">Loading…</pre></section>
    <section><h2>Incidents</h2><pre id="incidents">Loading…</pre></section>
    <section class="wide"><h2>Telemetry samples</h2><pre id="metrics">Loading…</pre></section>
    <section class="wide">
      <h2>Configured assistant</h2>
      <form id="queryForm">
        <label for="query">Operational question</label><br>
        <input id="query" name="query" required autocomplete="off">
        <button id="queryButton" type="submit">Ask configured assistant</button>
      </form>
      <pre id="queryResult" class="muted">No query submitted.</pre>
    </section>
  </main>
  <script>
    const serviceName = document.getElementById('serviceName');
    serviceName.textContent = {{ service_name|tojson }};
    document.getElementById('version').textContent = {{ version|tojson }};

    function setText(id, value, className = '') {
      const element = document.getElementById(id);
      element.className = className;
      element.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }

    async function getJson(path, options = {}) {
      const response = await fetch(path, { headers: { 'Accept': 'application/json' }, ...options });
      const payload = await response.json();
      if (!response.ok) {
        const message = payload && payload.error ? payload.error.message : `HTTP ${response.status}`;
        throw new Error(message);
      }
      return payload;
    }

    async function refresh() {
      const jobs = [
        ['status', '/api/status'],
        ['slo', '/api/slo'],
        ['alerts', '/api/alerts'],
        ['incidents', '/api/incidents'],
        ['metrics', '/api/metrics']
      ];
      await Promise.all(jobs.map(async ([id, path]) => {
        try {
          const payload = await getJson(path);
          setText(id, payload);
        } catch (error) {
          setText(id, `Data unavailable: ${error.message}`, 'error');
        }
      }));
    }

    document.getElementById('queryForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('queryButton');
      const result = document.getElementById('queryResult');
      button.disabled = true;
      result.className = 'muted';
      result.textContent = 'Requesting configured assistant…';
      try {
        const payload = await getJson('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query: document.getElementById('query').value })
        });
        setText('queryResult', payload);
      } catch (error) {
        result.className = 'error';
        result.textContent = `Assistant unavailable: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('query').maxLength = {{ max_query_length|tojson }};
    refresh();
    window.setInterval(refresh, {{ refresh_seconds * 1000|tojson }});
  </script>
</body>
</html>
